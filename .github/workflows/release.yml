# Release pipeline.
#
# TRIGGERED BY THE TAG, not by another workflow. The previous version listened for CI completing
# via `workflow_run`, and that is why it stopped working. A `workflow_run` job executes in the
# context of the DEFAULT BRANCH: `github.ref` is `refs/heads/main` no matter what was pushed, so
# every `refs/tags/v*` branch in its gating logic was unreachable and the release could never
# classify itself as a release. Its last successful run was 2025-07-21; a finished 0.5.2 sat
# unshipped for a year behind it.
#
# MARKETPLACE PUBLISHING IS OFF UNLESS DELIBERATELY ENABLED. It requires BOTH a stable tag AND a
# repository variable `MARKETPLACE_PUBLISH` set to `enabled`. Until that variable exists, pushing a
# tag can only ever produce a DRAFT GitHub release - which makes the pipeline safe to test with
# real tags, and testing it with real tags is the only way to know it works.
#
# To publish for real later: set the variable, or run this workflow manually with publish=true.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: 'Publish to the VS Code Marketplace (otherwise draft release only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Fail here rather than shipping something that does not compile or lint. The extension
      # tests need a display and a real VS Code, so they run in CI on push, not here.
      - name: Check types and lint
        run: |
          npm run check-types
          npm run lint

      - name: Work out what this tag is
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")

          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # A prerelease is anything with a suffix: v0.6.0-rc.1, v0.6.0-beta.2
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true"  >> "$GITHUB_OUTPUT"
          fi

          # The tag and package.json must agree. A mismatch means somebody tagged without
          # bumping, and the .vsix would carry a version nobody asked for.
          if [[ "$VERSION" != "$PKG" ]]; then
            echo "::error::Tag $TAG says $VERSION but package.json says $PKG. Bump one of them."
            exit 1
          fi

      - name: Package the .vsix
        run: |
          npm install -g @vscode/vsce
          vsce package --out "excel-power-query-editor-${{ steps.meta.outputs.version }}.vsix"

      - name: Check the package contains what it must
        run: |
          FILE="excel-power-query-editor-${{ steps.meta.outputs.version }}.vsix"
          unzip -l "$FILE" > /tmp/contents.txt
          for required in \
            "extension/dist/extension.js" \
            "extension/resources/live-sync/excel-live-sync.ps1" \
            "extension/resources/live-sync/RunningObjects.cs.txt" \
            "extension/resources/symbols/excel-pq-symbols.json"; do
            if ! grep -q "$required" /tmp/contents.txt; then
              echo "::error::Package is missing $required"
              exit 1
            fi
          done
          echo "All required files present."

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
          retention-days: 30

  github-release:
    name: Draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Create the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Excel Power Query Editor ${{ github.ref_name }}
          # DRAFT deliberately: nothing becomes visible until a human reads it and clicks publish.
          draft: true
          prerelease: ${{ needs.build.outputs.is_prerelease }}
          generate_release_notes: true
          files: '*.vsix'
          body: |
            ## Install

            Download the `.vsix` below, then in VS Code:
            **Extensions → … → Install from VSIX…**

            Or from the marketplace once this version is published there.

            ---

            See [CHANGELOG.md](https://github.com/ewc3labs/excel-power-query-editor/blob/main/CHANGELOG.md)
            for the readable version — the generated list below is accurate but terse.

  marketplace:
    name: Publish to the Marketplace
    needs: [build, github-release]
    runs-on: ubuntu-latest
    # Three conditions, all required. Removing any one of them makes an accidental publish
    # possible, and an accidental publish cannot be taken back.
    if: >-
      needs.build.outputs.is_prerelease == 'false' &&
      (vars.MARKETPLACE_PUBLISH == 'enabled' || inputs.publish_marketplace == true)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "::error::VSCE_PAT is not configured. Add it as a repository secret."
            exit 1
          fi
          npm install -g @vscode/vsce
          vsce publish --packagePath *.vsix --pat "$VSCE_PAT"

  summary:
    name: Summary
    needs: [build, github-release, marketplace]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          {
            echo "### ${{ github.ref_name }}"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Build | ${{ needs.build.result }} |"
            echo "| Draft release | ${{ needs.github-release.result }} |"
            echo "| Marketplace | ${{ needs.marketplace.result }} |"
            echo ""
            if [[ "${{ needs.marketplace.result }}" == "skipped" ]]; then
              echo "Marketplace publishing was skipped. It requires a stable tag AND the"
              echo "repository variable \`MARKETPLACE_PUBLISH\` set to \`enabled\`, or a manual"
              echo "run with publish enabled."
            fi
            echo ""
            echo "The GitHub release is a **draft** until somebody publishes it."
          } >> "$GITHUB_STEP_SUMMARY"
