# Release pipeline.
#
# TRIGGERED BY THE TAG, not by another workflow. The previous version listened for CI completing
# via `workflow_run`, and that is why it stopped working. A `workflow_run` job executes in the
# context of the DEFAULT BRANCH: `github.ref` is `refs/heads/main` no matter what was pushed, so
# every `refs/tags/v*` branch in its gating logic was unreachable and the release could never
# classify itself as a release. Its last successful run was 2025-07-21; a finished 0.5.2 sat
# unshipped for a year behind it.
#
# MARKETPLACE PUBLISHING IS OFF UNLESS DELIBERATELY ENABLED. It requires BOTH a plain `vX.Y.Z` tag
# AND a repository variable `MARKETPLACE_PUBLISH` set to `enabled`. Until that variable exists,
# pushing a tag can only ever produce a DRAFT GitHub release - which makes the pipeline safe to test
# with real tags, and testing it with real tags is the only way to know it works.
#
# To publish for real later: set the variable, or run this workflow manually with publish=true.
#
# TWO CHANNELS, DECIDED BY THE MINOR VERSION. The Marketplace cannot hold one version as both stable
# and pre-release, so VS Code's convention is major.EVEN.patch stable, major.ODD.patch pre-release:
#
#   v0.6.0       -> stable channel      (everyone with auto-update)
#   v0.7.0       -> pre-release channel (only users who opted in)
#   v0.6.0-rc.2  -> neither; draft GitHub release with a VSIX to hand somebody
#
# AUTHENTICATION IS PAT-FREE EITHER WAY, AND THE MODE IS CONFIGURATION. Azure DevOps personal
# access tokens are retired on 2026-12-01. The repository variable MARKETPLACE_AUTH selects:
#
#   entra  Entra ID workload identity federation -> vsce publish --azure-credential
#          Microsoft's documented route today. Runs on stable vsce.
#   oidc   GitHub OIDC exchanged directly with the Marketplace -> vsce publish --oidc
#          No Azure at all. Waiting on the Marketplace to expose its trust policy.
#
# No default and no fallback: unset or misspelled fails the publish job, and a failure in one mode
# never retries in the other. Setup for both is docs/Marketplace_Identity.md, and nothing can publish
# until that work is done.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.6.0. Required - a manual run has no tag of its own.'
        type: string
        required: true
      publish_marketplace:
        description: 'Publish to the VS Code Marketplace (otherwise draft release only)'
        type: boolean
        default: false
      channel:
        description: 'Assert which channel this is. Fails if it disagrees with the version.'
        type: choice
        default: auto
        options: [auto, stable, prerelease]

# LEAST PRIVILEGE, PER JOB. The default here is read, and each job asks for exactly what it needs:
# `github-release` writes a release, `marketplace` mints an OIDC token. Nothing else gets either,
# and in particular the build job - the one that runs the most third-party code - can write nothing.
permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      base: ${{ steps.meta.outputs.base }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      channel: ${{ steps.meta.outputs.channel }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      # On a manual run GITHUB_REF is a BRANCH, so the tag has to be named and checked out
      # explicitly. Without this the workflow advertised manual publishing and could not do it: the
      # version derivation below produced a non-version string and failed the comparison.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Fail here rather than shipping something that does not compile or lint. The extension
      # tests need a display and a real VS Code, so they run in CI on push, not here.
      - name: Check types and lint
        run: |
          npm run check-types
          npm run lint

      # THE RELEASE MUST NOT OUTRUN THE TESTS.
      #
      # CI and this workflow are triggered independently, so before this step a tag could produce a
      # published VSIX while that same commit's test run was still going - or had already failed.
      # Type checking and linting are not a substitute for the suite.
      #
      # xvfb because the tests drive a real VS Code, which needs a display.
      - name: Run tests
        uses: coactions/setup-xvfb@v1
        with:
          run: npm test
        env:
          CI: true

      - name: Documentation is current
        run: npm run docs:check

      - name: Work out what this tag is
        id: meta
        run: |
          # A manual run has no tag ref, so take the one that was asked for.
          TAG="${{ inputs.tag }}"
          if [[ -z "$TAG" ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi

          # Validate before anything acts on it. A typo in the manual form used to travel silently
          # into a checkout, a package name, and a release title.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag. Expected vX.Y.Z or vX.Y.Z-suffix."
            exit 1
          fi

          VERSION="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")

          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # A prerelease is anything with a suffix: v0.6.0-rc.1, v0.6.0-beta.2
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true"  >> "$GITHUB_OUTPUT"
          fi

          # The tag and package.json must agree, comparing BASE versions.
          #
          # A VS Code extension version must be plain x.y.z - vsce rejects a prerelease suffix - so
          # package.json can never literally equal a tag like v0.6.0-rc.1. Compare v0.6.0-rc.1
          # against 0.6.0 and the intent is preserved: a tag that names a version nobody bumped to
          # still fails loudly, and release candidates can still be cut.
          BASE="${VERSION%%-*}"
          if [[ "$BASE" != "$PKG" ]]; then
            echo "::error::Tag $TAG resolves to $BASE but package.json says $PKG. Bump one of them."
            exit 1
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

          # WHICH MARKETPLACE CHANNEL THIS IS, DERIVED FROM THE MINOR BEING ODD OR EVEN.
          #
          # The Marketplace has no notion of a semver prerelease suffix - a version is either the
          # stable one or the pre-release one, and THE SAME VERSION CANNOT BE BOTH. VS Code's
          # published convention is therefore major.EVEN.patch for stable and major.ODD.patch for
          # pre-release, and users opt into the pre-release channel in the extension pane.
          #
          #   v0.6.0      even minor  -> stable
          #   v0.7.0      odd minor   -> pre-release channel
          #   v0.6.0-rc.2 has a suffix -> neither; GitHub draft only
          #
          # An rc tag stays off the Marketplace entirely. It is for handing somebody a VSIX, and
          # 5,450 installs with auto-update are not the audience for a release candidate.
          MINOR="${BASE#*.}"; MINOR="${MINOR%%.*}"
          if [[ "$TAG" != "v$BASE" ]]; then
            CHANNEL=none
          elif (( MINOR % 2 == 1 )); then
            CHANNEL=prerelease
          else
            CHANNEL=stable
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Marketplace channel: $CHANNEL"

          # STATE YOUR INTENT AND HAVE IT CHECKED, if you are running this by hand.
          #
          # Deriving the channel from the version makes the wrong channel impossible, but it also
          # makes it SILENT: someone who believes they are shipping 0.7.0 to stable gets a
          # pre-release and no complaint, having consumed the version number permanently. So a
          # manual run may assert what it thinks this is, and a disagreement fails here - before
          # anything is published - rather than being discovered on the Marketplace afterwards.
          WANTED="${{ inputs.channel }}"
          if [[ -n "$WANTED" && "$WANTED" != "auto" && "$WANTED" != "$CHANNEL" ]]; then
            echo "::error::You asked for the $WANTED channel, but $TAG is $CHANNEL."
            echo "::error::The Marketplace cannot hold one version as both, so the channel comes from"
            echo "::error::the minor version: EVEN is stable, ODD is pre-release. Re-tag to change it."
            exit 1
          fi

      - name: Package the .vsix
        run: |
          # --pre-release is baked into the VSIX manifest at PACKAGE time, not publish time.
          # `vsce publish --pre-release` throws outright on a package that was not built with it, so
          # the channel has to be decided here or the publish job cannot honour it.
          FLAG=""
          if [[ "${{ steps.meta.outputs.channel }}" == "prerelease" ]]; then FLAG="--pre-release"; fi

          # THE LOCKFILE'S vsce, not whatever `latest` is this morning.
          #
          # `npm install -g @vscode/vsce` threw away the determinism `npm ci` had just established -
          # and it did so in the step that builds the artifact users install, while the publish step
          # was being scrupulously pinned. `npm exec` uses the copy npm ci placed in node_modules.
          npm exec -- vsce package $FLAG --out "excel-power-query-editor-${{ steps.meta.outputs.base }}.vsix"

      - name: Check the package contains what it must
        run: |
          FILE="excel-power-query-editor-${{ steps.meta.outputs.base }}.vsix"
          unzip -l "$FILE" > /tmp/contents.txt
          for required in \
            "extension/dist/extension.js" \
            "extension/resources/live-sync/excel-live-sync.ps1" \
            "extension/resources/live-sync/RunningObjects.cs.txt" \
            "extension/resources/symbols/excel-pq-symbols.json"; do
            if ! grep -q "$required" /tmp/contents.txt; then
              echo "::error::Package is missing $required"
              exit 1
            fi
          done
          echo "All required files present."

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
          retention-days: 30

  github-release:
    name: Draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write     # creates the draft release and uploads the VSIX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      # USE THE TAG THE BUILD RESOLVED, NOT `github.ref_name`.
      #
      # On a manual run `github.ref_name` is the BRANCH the workflow was launched from, so a
      # dispatch for v0.6.0 packaged 0.6.0 correctly and then created the release against `main`.
      # The build job already does the work of resolving and validating the tag; everything
      # downstream must use its answer rather than re-deriving a different one from the context.
      - name: Create the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Excel Power Query Editor ${{ needs.build.outputs.tag }}
          # DRAFT deliberately: nothing becomes visible until a human reads it and clicks publish.
          draft: true
          prerelease: ${{ needs.build.outputs.is_prerelease }}
          generate_release_notes: true
          files: '*.vsix'
          body: |
            ## Install

            Download the `.vsix` below, then in VS Code:
            **Extensions → … → Install from VSIX…**

            Or from the marketplace once this version is published there.

            ---

            See [CHANGELOG.md](https://github.com/ewc3labs/excel-power-query-editor/blob/main/CHANGELOG.md)
            for the readable version — the generated list below is accurate but terse.

  marketplace:
    name: Publish to the Marketplace
    needs: [build, github-release]
    runs-on: ubuntu-latest
    # Three conditions, all required. Removing any one of them makes an accidental publish
    # possible, and an accidental publish cannot be taken back - a version number is consumed
    # permanently, and 5,450 installs mostly have auto-update on.
    if: >-
      needs.build.outputs.channel != 'none' &&
      (vars.MARKETPLACE_PUBLISH == 'enabled' || inputs.publish_marketplace == true)

    # THE HUMAN GATE. Make this a protected environment requiring a reviewer.
    #
    # A protected environment does not merely pause the job - the job does not START, so the OIDC
    # token is never minted. The capability to publish does not exist until a person approves it,
    # which is a stronger property than checking a box in a form and hoping.
    #
    # It is also what keeps "nothing reaches users without a human" true once MARKETPLACE_PUBLISH is
    # enabled. Publishing the draft GitHub release and publishing to the Marketplace are independent
    # acts, and only the first one was ever gated by a human editing a draft.
    #
    # The Marketplace trust policy may also name this environment.
    #
    # It is also the federation subject in `entra` mode:
    #   repo:ewc3labs/excel-power-query-editor:environment:marketplace
    # Trusted publishing does not use a subject at all, so in `oidc` mode this is purely the gate.
    environment: marketplace

    permissions:
      id-token: write     # vsce asks GitHub for the OIDC token itself; without this it cannot
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      # The artifact is deterministic and both publisher versions are pinned; without this the Node
      # that runs them is whatever the runner image happens to ship. Completes the story.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # NO PAT IN EITHER MODE, and neither falls back to one on failure - which is correct, and
      # worth knowing when you are reading an error.
      #
      #   entra  azure/login establishes an Azure CLI session, which vsce's --azure-credential picks
      #          up via AzureCliCredential, second in the chain it builds. Runs on stable vsce.
      #   oidc   vsce asks GitHub for a token with audience marketplace.visualstudio.com and
      #          exchanges it at POST /_apis/gallery/token. No Azure in the path at all. Pinned to a
      #          prerelease: 3.9.2 answers `unknown option '--oidc'`, and the flag is hidden from
      #          --help in 3.9.3-5, so grepping help output reports it does not exist.
      #
      # ENTRA MODE ONLY. Skipped entirely when MARKETPLACE_AUTH is `oidc`, which needs no Azure.
      - name: Sign in to Entra ID
        if: vars.MARKETPLACE_AUTH == 'entra'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The identity publishes an extension; it is attached to no subscription, and azure/login
          # fails looking for one without this.
          allow-no-subscriptions: true

      # ONE STEP, DISPATCHING ON MARKETPLACE_AUTH, AND IT FAILS CLOSED.
      #
      # Deliberately not two `if:`-gated steps. If the variable were unset or misspelled, both would
      # simply skip and the job would go GREEN having published nothing - a silent success, which is
      # the worst outcome available. A `case` with a default arm cannot do that.
      #
      # NO FALLBACK BETWEEN MODES, EVER. If `oidc` fails because the Marketplace has not exposed the
      # trust policy yet, it fails. Quietly retrying through Entra would mean nobody ever finds out
      # which contract actually published the extension.
      - name: Publish
        env:
          MARKETPLACE_AUTH: ${{ vars.MARKETPLACE_AUTH }}
          # Two pins, on purpose. `--azure-credential` is in stable, so the interim production path
          # runs no preview code at all; only trusted publishing needs the prerelease build. Drop
          # VSCE_OIDC_VERSION once --oidc reaches latest, then drop this whole switch.
          VSCE_ENTRA_VERSION: 3.9.2
          VSCE_OIDC_VERSION: 3.9.3-5
        run: |
          FLAG=""
          if [[ "${{ needs.build.outputs.channel }}" == "prerelease" ]]; then FLAG="--pre-release"; fi

          case "$MARKETPLACE_AUTH" in
            entra)
              VERSION="$VSCE_ENTRA_VERSION"; AUTH="--azure-credential" ;;
            oidc)
              VERSION="$VSCE_OIDC_VERSION";  AUTH="--oidc" ;;
            *)
              echo "::error::MARKETPLACE_AUTH must be 'entra' or 'oidc' (got '${MARKETPLACE_AUTH:-unset}')."
              echo "::error::See docs/Marketplace_Identity.md. There is deliberately no default."
              exit 1 ;;
          esac

          echo "Authenticating with: $AUTH   (vsce $VERSION)"
          npx --yes "@vscode/vsce@${VERSION}" publish --packagePath *.vsix $AUTH $FLAG

  # Open VSX is where Cursor, Windsurf, and VSCodium install from. Those users currently cannot
  # install this extension at all, which is a strange gap for a tool whose pitch is editing Power
  # Query M with an AI coding agent.
  #
  # DELIBERATELY NON-BLOCKING. A second registry being down, rate-limiting, or rejecting a token
  # must not turn a successful Marketplace publish into a red release. It reports and moves on.
  open-vsx:
    name: Publish to Open VSX
    needs: [build, marketplace]
    runs-on: ubuntu-latest
    if: needs.marketplace.result == 'success'
    continue-on-error: true
    # SAY WHICH, because "success" covered both "published" and "did nothing" - and the first time
    # this ran it did nothing, reported green, and nobody would have known without checking Open VSX
    # by hand. A job that cannot distinguish silence from success is the exact thing this pipeline
    # keeps being rebuilt to avoid.
    outputs:
      status: ${{ steps.publish.outputs.status }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish
        id: publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          OVSX_VERSION: 1.1.1
        run: |
          if [[ -z "$OVSX_PAT" ]]; then
            echo "status=skipped (no OVSX_PAT)" >> "$GITHUB_OUTPUT"
            echo "::warning::OVSX_PAT is not configured - skipping Open VSX."
            exit 0
          fi

          # NO --pre-release HERE, DELIBERATELY. ovsx warns "Ignoring option '--pre-release' for
          # prepackaged extension" and moves on: the channel is already baked into the VSIX manifest
          # at package time. Passing it would look like it decided something.
          npx --yes "ovsx@${OVSX_VERSION}" publish --packagePath *.vsix -p "$OVSX_PAT"
          echo "status=published" >> "$GITHUB_OUTPUT"

  summary:
    name: Summary
    needs: [build, github-release, marketplace, open-vsx]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          CHANNEL="${{ needs.build.outputs.channel }}"
          {
            echo "### ${{ needs.build.outputs.tag }}"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Build | ${{ needs.build.result }} |"
            echo "| Draft release | ${{ needs.github-release.result }} |"
            echo "| Marketplace | ${{ needs.marketplace.result }} |"
            echo "| Open VSX | ${{ needs.open-vsx.outputs.status || needs.open-vsx.result }} |"
            echo ""
            case "$CHANNEL" in
              stable)     echo "Channel: **stable** - every user with auto-update gets this." ;;
              prerelease) echo "Channel: **pre-release** - only users who opted in receive it." ;;
              none)       echo "Channel: **none**. A tag with a suffix never reaches a marketplace; the VSIX is attached to the draft release for hand-installation." ;;
            esac
            echo ""
            if [[ "${{ needs.marketplace.result }}" == "skipped" ]]; then
              echo "Marketplace publishing was skipped. It requires a plain \`vX.Y.Z\` tag AND the"
              echo "repository variable \`MARKETPLACE_PUBLISH\` set to \`enabled\`, or a manual"
              echo "run with publish enabled."
            fi
            echo ""
            echo "The GitHub release is a **draft** until somebody publishes it."
          } >> "$GITHUB_STEP_SUMMARY"
