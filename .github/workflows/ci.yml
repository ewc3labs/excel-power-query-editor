name: CI Pipeline
on:
  # Manually runnable, because .github/** is in paths-ignore below - which means a change to CI
  # cannot trigger CI. Without this there is no way to test a pipeline change except by making an
  # unrelated source edit, which is how junk commits get made.
  workflow_dispatch:
  push:
    branches: [main, release/**, wip/**, hotfix/**]
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
      - ".vscode/**"
  pull_request:
    branches: [main, release/**, wip/**, hotfix/**]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
      - ".vscode/**"

jobs:
  test:
    strategy:
      # fail-fast: false, so ONE flaky leg does not cancel the other five.
      #
      # With the default, a macOS runner failing to launch VS Code canceled ubuntu and windows
      # before they reported, so every run said "CI failed" and none of them said what actually
      # works. A matrix that cannot tell you which platform broke is not telling you anything.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]

    runs-on: ${{ matrix.os }}

    # macOS is allowed to fail without failing the run.
    #
    # vscode-test cannot launch VS Code on the ARM runner at all - spawn .../Visual Studio
    # Code.app/Contents/MacOS/Electron ENOENT - which is a harness problem rather than anything
    # in this extension. Nobody here has a Mac to reproduce it on, and the overlap between "does
    # deep Power Query work in Excel 365" and "on a Mac" is thin.
    #
    # It still RUNS, so the day it starts working we will see it, and a Mac user who solves it is
    # welcome to send a PR. What it must not do is keep the whole matrix red, because a
    # permanently failing CI is one nobody reads - which is exactly how this pipeline went a year
    # without anyone noticing it had stopped.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint
        continue-on-error: false

      - name: Run type checking
        run: npm run check-types
        continue-on-error: false

      - name: Check documentation
        run: npm run docs:check
        continue-on-error: false


      - name: Run tests
        uses: coactions/setup-xvfb@v1
        with:
          run: npm test
        env:
          CI: true
        continue-on-error: false

      # `npm test` records the suite's size into test-counts.json, which the documentation reads.
      # If running the tests changed it, the committed number was stale.
      - name: Recorded test count is current
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        run: git diff --exit-code test-counts.json
        continue-on-error: false

      - name: Build extension
        run: npm run package
        continue-on-error: false

      - name: Package VSIX
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        run: npm run package-vsix

      - name: Upload VSIX artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        uses: actions/upload-artifact@v4
        with:
          name: excel-power-query-editor-vsix
          path: "*.vsix"
          retention-days: 30

  test-summary:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Test Results Summary
        run: |
          echo "## Test Results 🧪" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.test.result }}" = "success" ]; then
            # SAY WHAT ACTUALLY PASSED.
            #
            # macOS is continue-on-error, so `needs.test.result` reports success while both macOS
            # legs may have failed to launch VS Code at all (PQ-20). Printing "all platforms" there
            # is the same class of untruth as a hard-coded test count: technically derived from a
            # green signal, and wrong.
            echo "✅ **Required platforms passed** — Ubuntu and Windows, on Node 22 and 24." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> macOS legs are \`continue-on-error\`: the VS Code test harness cannot launch Electron on the ARM runner (PQ-20). Check them individually rather than reading this summary as full coverage." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Test Coverage Areas:" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Extension lifecycle and activation" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Command registration and execution" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Integration with real Excel files" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Utility functions and configuration" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ File watching and auto-sync" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Backup creation and management" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Total: $(node -p "require('./test-counts.json').total") tests.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Tests failed.** Please check the test results above." >> $GITHUB_STEP_SUMMARY
          fi
